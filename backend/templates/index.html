<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Ingest receipt text, parse line items, export CSV reports.</p>
<form method="post" action="/ui/receipts"><input name="merchant" required/><textarea name="raw_text" rows="4" placeholder="Latte 4.50\nMuffin 3.25"></textarea><button>Ingest</button></form>
<ul>{% for r in receipts %}<li class="pill">{{ r.category }}</li> {{ r.merchant }} — ${{ "%.2f"|format(r.total) }}{% endfor %}</ul>
</main></body></html>
