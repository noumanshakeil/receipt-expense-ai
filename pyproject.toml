[project]
name = "receipt-expense-ai"
version = "2.0.0"
description = "Receipt ingest from plain text, line-item parsing, category suggestions, and expense report export — vision simulated offline without GPU."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
